services:
  web:
    image: ${IMAGE_REF:-legeni-webapp:latest}
    restart: always
    ports:
      - "${PORT:-8081}:5000"
    environment:
      APP_ENV: ${APP_ENV:-staging}
      APP_COLOR: ${APP_COLOR:-#bf8700}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret}"]
